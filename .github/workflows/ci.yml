name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run Type Check
        run: npm run type-check

      - name: Run Tests
        run: npm run test
        
      - name: Validate Content
        run: npm run validate-content
        
      - name: Audit Tailwind Classes
        run: npm run audit-classes
        
      - name: Build Next.js
        run: npm run build
